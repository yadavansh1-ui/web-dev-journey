<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation</title>

  <style>

    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    form {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 10px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }

  </style>
</head>
<body>

  <form id="form">

    <input
      type="text"
      id="username"
      placeholder="Enter username"
    >

    <input
      type="email"
      id="email"
      placeholder="Enter email"
    >

    <button type="submit">
      Submit
    </button>

    <p id="message"></p>

  </form>

  <script src="script.js"></script>

</body>
</html>
