<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Events</title>

  <style>

    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
      margin: 10px;
    }

    #box {
      width: 200px;
      height: 200px;
      background: crimson;
      margin: 20px auto;
      transition: 0.3s;
    }

  </style>

</head>
<body>

  <h1 id="heading">JavaScript Events</h1>

  <button id="clickBtn">Click Me</button>

  <input
    type="text"
    id="inputField"
    placeholder="Type something"
  >

  <div id="box"></div>

  <script src="script.js"></script>

</body>
</html>
